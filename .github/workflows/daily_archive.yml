name: Update Weather Archive

on:
  schedule:
    - cron: '0 6*/2 * *' # Läuft jeden zweiten Tag um 06:00 Uhr UTC
  workflow_dispatch:      # Ermöglicht auch das manuelle Starten über den GitHub-Tab "Actions"

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Wichtig, damit das Skript Änderungen in das Repo pushen darf

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: R einrichten
        uses: r-lib/actions/setup-r@v2

      - name: R-Pakete installieren
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            jsonlite
            dplyr

      - name: Skript ausführen
        run: Rscript R/update_archive.R # Passe den Pfad an, falls dein Skript woanders liegt

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/EMOS-Data/ensemble_archiv.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of ensemble archive [skip ci]" && git push)
          
          
          
          
